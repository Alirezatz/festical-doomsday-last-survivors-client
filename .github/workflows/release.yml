name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            folder: windows-x64
            archive: FesticalDoomsdayClient-windows-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            folder: linux-x64
            archive: FesticalDoomsdayClient-linux-x64.tar.gz
          - name: macOS arm64
            os: macos-latest
            rid: osx-arm64
            folder: macos-arm64
            archive: FesticalDoomsdayClient-macos-arm64.tar.gz
          - name: macOS x64
            os: macos-15-intel
            rid: osx-x64
            folder: macos-x64
            archive: FesticalDoomsdayClient-macos-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self contained, single file)
        run: >
          dotnet publish src/FesticalDoomsday.Client/FesticalDoomsday.Client.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output artifacts/${{ matrix.folder }}

      - name: Package
        shell: bash
        run: |
          cd artifacts/${{ matrix.folder }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "../${{ matrix.archive }}" ./*
          else
            tar -czf "../${{ matrix.archive }}" ./*
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.folder }}
          path: artifacts/${{ matrix.archive }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
